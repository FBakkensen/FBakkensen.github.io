---
layout: base
---
<article class="page wrap">
  <header class="page__header">
    <h1 class="page-title">{{ page.title | escape }}</h1>
    {% if page.description %}<p class="deck">{{ page.description | escape }}</p>{% endif %}
  </header>
  <div class="post-body">
    {{ content }}
  </div>
</article>
