name: Generate llms.txt

on:
  push:
    branches: [main]
    paths:
      - "_posts/**"
      - "scripts/generate_llms_txt.py"
      - "scripts/test_generate_llms_txt.py"
      - ".github/workflows/generate-llms-txt.yml"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run tests
        run: python -m unittest discover -s scripts -v

      - name: Generate llms.txt and llms-full.txt
        run: python scripts/generate_llms_txt.py

      - name: Commit if changed
        run: |
          git add llms.txt llms-full.txt
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: regenerate llms.txt files"
            git push
          fi
